plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.adrienby.silkwarp'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.adrienby.silkwarp'
        minSdk 30
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Fixed key committed to the repo so every CI build installs over the previous one.
    signingConfigs {
        shared {
            storeFile file('silkwarp.keystore')
            storePassword 'silkwarp'
            keyAlias 'silkwarp'
            keyPassword 'silkwarp'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
